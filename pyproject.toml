[project]
name = "pytest-verifies"
version = "1.0.0"
description = "Enterprise requirements traceability plugin for pytest"
readme = "README.md"
authors = [
    { name = "Dale Collison", email = "dale.a.collison@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0",
]

[project.entry-points.pytest11]
verifies = "pytest_verifies.plugin"

[project.scripts]
pytest-verifies = "pytest_verifies.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-xdist>=3.0",
    "pyyaml>=6.0",
    "ruff",
    "mypy",
    "pre-commit>=4.6.2",
    "pre-commit-uv>=4.3.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W293"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
